<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>404 – Page not found</title><style>body{font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;background:#f6f7f9;color:#222}main{max-width:520px;margin:12vh auto;padding:0 20px;text-align:center}h1{font-size:28px;margin:0 0 12px}p{color:#555}a{color:#2456d6}</style></head>
<body>
<main>
<h1>404 – Page not found</h1>
<p>The page you are looking for doesn't exist.</p>
<p><a href="/qa-docs-prueba/">Go to the homepage</a></p>
<script>
// Solo para personas: si la ruta es /vN/archivo y la versión N no existe, ir a la última versión del mismo archivo.
// El status HTTP sigue siendo 404 (lo que recibe un scraper).
(function(){var LAST=8;var m=location.pathname.match(/^(.*?\/)v(\d+)\/(.+)$/);
if(m&&(+m[2]<1||+m[2]>LAST)){location.replace(m[1]+'v'+LAST+'/'+m[3]+location.search+location.hash);}})();
</script>
</main>
</body></html>
